apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
  namespace: agent-platform
data:
  ENVIRONMENT: production
  LOG_FORMAT: json
  AUTO_CREATE_SCHEMA: "false"
  SERVE_UI: "true"
  # Identity provider (OIDC). Example for Microsoft Entra ID:
  AUTH_MODES: '["jwt"]'
  JWT_JWKS_URL: https://login.microsoftonline.com/<tenant-id>/discovery/v2.0/keys
  JWT_ISSUER: https://login.microsoftonline.com/<tenant-id>/v2.0
  JWT_AUDIENCE: api://agent-platform
  JWT_TENANT_CLAIM: tid
  JWT_ROLES_CLAIM: roles
  ROLE_PERMISSIONS: '{"platform-admin":["*"],"analyst":["inventory.read","trading.exposure.read","documents.read","documents.write"]}'
  STATIC_TOKENS: '{}'
  ALLOWED_AGENT_HOSTS: '["*.agent-platform.svc.cluster.local","*.agent-platform.svc"]'
  LLM_PROVIDER: azure_openai
  LLM_MODEL: <deployment-name>
  LLM_BASE_URL: https://<resource>.openai.azure.com
  LLM_API_VERSION: <api-version>
  RATE_LIMIT_PER_MINUTE: "120"
  GUARDRAIL_MODE: flag
