name: agent-service

# Test -> build the image -> push to GitHub Container Registry (free for public images) -> roll the Azure
# Container App to the new image. The deploy job runs only when the Azure secrets exist, so forks and a fresh
# repo still get a green build.

on:
  push:
    branches: [main]
    paths: ["agent-service/**", ".github/workflows/agent-service.yml"]
  pull_request:
    paths: ["agent-service/**", ".github/workflows/agent-service.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # Azure OIDC login (no stored Azure password)

defaults:
  run:
    working-directory: agent-service

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: agents, POSTGRES_USER: agent, POSTGRES_PASSWORD: agent}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agent" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # proves a paused approval survives a restart against real PostgreSQL (tests/test_postgres.py)
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: agent-service/requirements.txt}
      - run: pip install -r requirements.txt pytest==8.4.2
      - run: python -m pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-service:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/agent-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll the container app to the new image
        working-directory: .
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update --name agent-service --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.image }}" --only-show-errors --output none
          url=$(az containerapp show -n agent-service -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do curl -fsS "https://$url/health" && exit 0; sleep 5; done; exit 1
